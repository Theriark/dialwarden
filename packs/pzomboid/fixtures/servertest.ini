# Synthetic servertest.ini written by Theriark for the Dialwarden demo
# server and tests; the comments are our own words, not the game's.

# Whether characters can hurt each other; the safety system gives each
# player a personal switch.
PVP=true
# Gives each player a personal PVP toggle instead of everyone being fair
# game.
SafetySystem=true
# Draws a marker above characters whose PVP switch is on.
ShowSafety=true
# Seconds before a personal PVP change takes hold. Min: 0 Max: 1000 Default: 2
SafetyToggleTimer=2
# Close-combat damage between players, as a percentage.
PVPMeleeDamageModifier=30.0
# Gun damage between players, as a percentage.
PVPFirearmDamageModifier=50.0

# The in-game clock stops while nobody is online.
PauseEmpty=true
# Tired characters may use beds.
SleepAllowed=false
# Fatigue builds until characters must sleep; needs beds allowed.
SleepNeeded=false
# How much faster time runs while everyone sleeps. Min: 1,0 Max: 100,0
FastForwardMultiplier=40.0
# All fire except campfires is blocked.
NoFire=false
# A chat notice whenever a player character dies.
AnnounceDeath=false
# Players can knock each other down; experimental in Build 42.
KnockedDownAllowed=false
# Most items per container, nails included; 0 means no cap.
ItemNumbersLimitPerContainer=0
# How far engine noise carries zombies. Min: 0 Max: 10 Default: 0,5
CarEngineAttractionModifier=0.5
# Sledgehammers may demolish world objects.
AllowDestructionBySledgehammer=true
# Running into a player can shove them over.
PlayerBumpPlayer=false
# Days before old blood decals clear; the sandbox file has its own copy.
BloodSplatLifespanDays=0

# The public list shows this server.
Public=false
# Name in the browser lists.
PublicName=My PZ Server
# Text under the name; an escape sequence makes a line break.
PublicDescription=
# Join password; blank means anyone can connect.
Password=
# Non-admin player cap.
MaxPlayers=32
# Latency limit that disconnects players; 0 turns it off.
PingLimit=0
# New players create an account just by joining.
Open=true
# Build 41 only: Build 42 ignores this key and it is kept untouched.
AutoCreateUserInWhiteList=false
# Accounts are deleted when their character dies.
DropOffWhiteListAfterDeath=false
# User names one Steam account may register; 0 removes the cap.
MaxAccountsPerUser=0

# Primary and second UDP ports and the remote console port.
DefaultPort=16261
UDPPort=16262
RCONPort=27015
# Console secret; empty keeps the console off.
RCONPassword=
# Clients whose scripts differ are refused.
DoLuaChecksum=true
# Build 41 anti-cheat switch, kept untouched.
AntiCheatProtectionType1=true

# Mod IDs and Workshop items, semicolon lists.
Mods=
WorkshopItems=
# Map order; custom maps come before the base map entry.
Map=Muldraugh, KY
# Fixed spawn point; 0,0,0 keeps the region choice.
SpawnPoint=0,0,0
# Items given to new characters.
SpawnItems=
# World seed and soft-reset marker.
Seed=dialwarden42demo
ResetID=400217

# Safehouses and factions.
PlayerSafehouse=false
AdminSafehouse=false
SafehouseAllowTrepass=true
SafehouseAllowFire=true
SafehouseAllowLoot=true
SafehouseAllowRespawn=false
SafehouseDaySurvivedToClaim=0
SafeHouseRemovalTime=144
DisableSafehouseWhenOwnerConnected=false
SafehousePreventsLootRespawn=true
Faction=true

# Chat and display.
GlobalChat=true
ChatStreams=s,r,a,w,y,sh,f,all
# The greeting shown at login; the game's line-break tag works in it.
ServerWelcomeMessage=Welcome to the synthetic Dialwarden demo server.<LINE>Press Tab to open the chat panel.
DisplayUserName=true
MouseOverToSeeDisplayName=true
MapRemotePlayerVisibility=1
VoiceEnable=true
VoiceMinDistance=10.0
VoiceMaxDistance=100.0

# Saving and backups.
SaveWorldEveryMinutes=0
BackupsCount=5
BackupsOnStart=true
BackupsPeriod=0

# Router port opening, anti-cheat and overload protection.
UPnP=true
SteamVAC=true
DenyLoginOnOverloadedServer=true

# Discord bridge.
DiscordEnable=false
DiscordToken=
DiscordChatChannel=

# An unknown Build 42 key the pack keeps untouched.
LoginQueueEnabled=false
